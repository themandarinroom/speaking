<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f5ed">
  <title>Mandarin Speaking Practice</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="landing-page">
  <header class="landing-site-header">
    <a class="landing-brand" href="index.html" aria-label="Speaking Practice home">
      <span class="landing-brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32" role="img"><rect x="10" y="4" width="12" height="17" rx="6"></rect><path d="M7 15.5v1.5a9 9 0 0 0 18 0v-1.5M16 26v3M11 29h10"></path></svg></span>
      <span class="landing-brand-copy"><strong>The Mandarin Room</strong><small>Speaking Practice</small></span>
    </a>
    <section class="landing-auth-panel" aria-label="Teacher account">
      <strong id="homeAuthState" data-i18n="teacherSignInPrompt">Sign in to create and publish speaking practice.</strong>
      <div><button id="homeSignInBtn" class="landing-auth-button" type="button" data-i18n="teacherSignIn">Teacher Sign in</button><button id="homeSignOutBtn" class="landing-auth-button" type="button" hidden data-i18n="signOut">Sign out</button></div>
    </section>
  </header>
  <main class="landing-main">
    <section class="landing-home-panel">
      <div id="landingModeGrid" class="landing-mode-grid">
        <section class="landing-mode-card landing-student-card" aria-labelledby="landingStudentTitle">
          <span class="landing-mode-card-top"><span class="landing-mode-symbol" aria-hidden="true">学</span></span>
          <strong id="landingStudentTitle" data-i18n="studentMode">Student Mode</strong>
          <span class="landing-mode-description" data-i18n="studentModeHelp">Choose a year level, listen and record.</span>
          <form id="homeYearForm" class="landing-student-entry">
            <label for="homeYearLevel"><span data-i18n="yearLevel">Year level</span><select id="homeYearLevel"></select></label>
            <button class="landing-entry-button" type="submit" data-i18n="joinYearLevel">Open year level</button>
          </form>
        </section>
        <a id="landingTeacherCard" class="landing-mode-card landing-teacher-card" href="teacher.html" hidden>
          <span class="landing-mode-card-top"><span class="landing-mode-symbol" aria-hidden="true">教</span><span class="landing-mode-arrow" aria-hidden="true">→</span></span>
          <strong data-i18n="teacherMode">Teacher Mode</strong>
          <span class="landing-mode-description" data-i18n="teacherModeHelp">Create Core and Challenge speaking practice.</span>
        </a>
      </div>
      <p class="privacy" data-i18n="privacyShort">All practice and recordings stay on this device.</p>
    </section>
  </main>
  <footer class="landing-footer">
    <span>App created by Wei Wang</span>
    <span>The Mandarin Room © 2026</span>
    <span class="landing-footer-tools"><span data-app-version></span><button class="landing-footer-language" data-language-toggle type="button">English / 中文</button></span>
  </footer>
  <script type="module" src="js/footer.js"></script>
  <script type="module" src="js/home.js?v=student-entry-auth-2"></script>
</body>
</html>
