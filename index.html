<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mandarin Speaking Practice</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="shell landing">
    <div class="topbar">
      <span class="version" data-app-version></span>
      <button class="language-button" data-language-toggle type="button">English / 中文</button>
    </div>
    <section class="card hero">
      <p class="eyebrow" data-i18n="classroomTool">Classroom tool</p>
      <h1 data-i18n="appTitle">Mandarin Speaking Practice</h1>
      <p data-i18n="homeIntro">Choose a mode to begin.</p>
      <div class="mode-grid">
        <a class="mode-card" href="teacher.html">
          <span class="mode-icon" aria-hidden="true">✏️</span>
          <strong data-i18n="teacherMode">Teacher Mode</strong>
          <span data-i18n="teacherModeHelp">Create the sentence and lesson settings.</span>
        </a>
        <a class="mode-card" href="student.html">
          <span class="mode-icon" aria-hidden="true">🎤</span>
          <strong data-i18n="studentMode">Student Mode</strong>
          <span data-i18n="studentModeHelp">Listen, explore words and record.</span>
        </a>
      </div>
      <p class="privacy" data-i18n="privacyShort">All practice and recordings stay on this device.</p>
    </section>
  </main>
  <footer class="app-footer">
    <div>App created by Wei Wang</div>
    <div>The Mandarin Room © 2026</div>
    <div data-app-version></div>
  </footer>
  <script type="module" src="js/footer.js"></script>
  <script type="module">
    import { initPageTranslations } from "./js/translations.js";
    initPageTranslations();
  </script>
</body>
</html>
